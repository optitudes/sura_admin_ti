# Configuración del cliente NIS (192.168.1.201) — dominio empresa.local

# /etc/defaultdomain
empresa.local

# /etc/yp.conf
domain empresa.local server 192.168.1.200

# /etc/nsswitch.conf (cada línea termina en "nis")
passwd:         files systemd nis
group:          files systemd nis
shadow:         files nis

# /etc/pam.d/common-session (crea el directorio personal en el primer inicio de sesión)
session optional pam_mkhomedir.so skel=/etc/skel umask=077
