# /etc/netplan/50-cloud-init.yaml — IP fija del servidor NTP/NIS (ProyectoFinal)
# En el cliente se usa la dirección 192.168.1.201/24.
network:
  version: 2
  ethernets:
    enp0s3:
      dhcp4: false
      addresses:
        - 192.168.1.200/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [8.8.8.8, 1.1.1.1]
